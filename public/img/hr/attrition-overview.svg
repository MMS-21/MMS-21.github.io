<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><rect width="960" height="580" fill="#fffaf0"/><g fill="#302d28" font-family="Arial,sans-serif"><text x="44" y="54" font-size="27">Where attrition concentrates</text><text x="44" y="85" font-size="15" fill="#665b4c">Recorded leavers as a share of each employee group</text><text x="44" y="147" font-size="17">Overall</text><rect x="290" y="126" width="164.8" height="30" rx="2" fill="#8b7049"/><text x="474.8" y="147" font-size="18">16.1%</text><text x="290" y="176" font-size="13" fill="#665b4c">237 of 1,470 employee records</text><text x="44" y="219" font-size="17">Overtime</text><rect x="290" y="198" width="312.1" height="30" rx="2" fill="#60869a"/><text x="622.1" y="219" font-size="18">30.5%</text><text x="290" y="248" font-size="13" fill="#665b4c">127 of 416 employee records</text><text x="44" y="291" font-size="17">No overtime</text><rect x="290" y="270" width="106.7" height="30" rx="2" fill="#97b2bf"/><text x="416.7" y="291" font-size="18">10.4%</text><text x="290" y="320" font-size="13" fill="#665b4c">110 of 1,054 employee records</text><text x="44" y="363" font-size="17">Sales Representative</text><rect x="290" y="342" width="406.4" height="30" rx="2" fill="#60869a"/><text x="716.4" y="363" font-size="18">39.8%</text><text x="290" y="392" font-size="13" fill="#665b4c">33 of 83 employee records</text><text x="44" y="435" font-size="17">Laboratory Technician</text><rect x="290" y="414" width="244.7" height="30" rx="2" fill="#97b2bf"/><text x="554.7" y="435" font-size="18">23.9%</text><text x="290" y="464" font-size="13" fill="#665b4c">62 of 259 employee records</text><text x="44" y="550" font-size="13" fill="#665b4c">Sample comparisons. These figures do not establish causes or annual turnover.</text></g></svg>